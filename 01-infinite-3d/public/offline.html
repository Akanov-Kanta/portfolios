<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="color-scheme" content="dark" />
    <title>Offline - Nazar Akanov</title>
    <!-- Served by public/sw.js for a page that isn't cached yet. Self-contained on purpose: no Next chunks,
         no web fonts, no external requests (none of them would load offline anyway). -->
    <style>
      :root {
        color-scheme: dark;
        --void: #0a0b10;
        --ink: #e8e9f0;
        --muted: #9096ad;
        --screen: #6cf2ff;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        --gutter: max(20px, env(safe-area-inset-left, 0px));
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--ink); }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
        padding:
          calc(env(safe-area-inset-top, 0px) + 12px)
          max(20px, env(safe-area-inset-right, 0px))
          calc(env(safe-area-inset-bottom, 0px) + 32px)
          var(--gutter);
        font: 400 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        /* the room's monitor glow, as a quiet memory of the world */
        background:
          radial-gradient(60% 40% at 78% 18%, rgba(108, 242, 255, 0.08), transparent 70%),
          radial-gradient(70% 30% at 20% 100%, rgba(255, 184, 107, 0.05), transparent 70%),
          var(--void);
        -webkit-tap-highlight-color: transparent;
      }
      .mark { display: inline-flex; align-items: center; min-width: 44px; min-height: 44px; color: var(--screen); }
      .mark svg { display: block; width: 44px; height: 24px; }
      main { max-width: 34rem; }
      .label {
        margin: 0 0 16px;
        font: 400 13px/1.4 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 14vw, 4.5rem);
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.04em;
        text-wrap: balance;
      }
      .rule { display: block; width: 3.5rem; height: 1px; margin: 20px 0 0; background: var(--screen); box-shadow: 0 0 12px var(--screen); }
      p.line { margin: 20px 0 0; max-width: 36ch; color: #c9cbd8; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        font: 400 12px/1 var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        white-space: nowrap;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: transform 90ms cubic-bezier(0.76, 0, 0.24, 1);
      }
      .pill:active { transform: scale(0.97); }
      .solid { background: var(--ink); color: var(--void); }
      .quiet { color: var(--ink); background: rgba(14, 16, 26, 0.88); box-shadow: inset 0 0 0 1px rgba(232, 233, 240, 0.18); }
      a:focus-visible { outline: 1.5px solid var(--screen); outline-offset: 3px; }
      .pill:focus-visible { border-radius: 999px; }
      @media (prefers-reduced-motion: reduce) { .pill { transition: none; } }
      @media (max-height: 500px) and (orientation: landscape) {
        body { justify-content: flex-start; gap: 16px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
        h1 { font-size: clamp(2.5rem, 14svh, 3.5rem); }
        .actions { margin-top: 20px; }
      }
    </style>
  </head>
  <body>
    <a class="mark" href="/" aria-label="Nazar Akanov, home">
      <svg viewBox="0 0 44 24" fill="none" aria-hidden="true">
        <path d="M7 3H3V21H7M10.5 20V4L19.5 20V4M23.5 20L28 4L32.5 20M25.1 14.5H30.9M37 3H41V21H37" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" />
      </svg>
    </a>
    <main>
      <p class="label">// signal lost</p>
      <h1>You're offline</h1>
      <span class="rule" aria-hidden="true"></span>
      <p class="line">This page isn't saved on this device yet.</p>
      <div class="actions">
        <a class="pill solid" href="/">Open home</a>
        <a class="pill quiet" href="">Retry</a>
      </div>
    </main>
    <script>addEventListener("online", function () { if (navigator.onLine) location.reload(); });</script>
  </body>
</html>
