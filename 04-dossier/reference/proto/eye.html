<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;display:flex;flex-wrap:wrap;gap:0}
svg{display:block}
</style></head><body>
<script>
/* Procedural "hand-drawn spiral-iris eye" — prototype for the dossier builder.
   eyeSVG(seed, opts) -> SVG string. All geometry in a -1..1 box; scale via viewBox. */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function eyeSVG(seed=1,o={}){
  const R=rng(seed), j=(s)=>(R()-.5)*2*s;
  const W=o.size||540, H=W*0.72, id='e'+seed;
  const L={x:-0.95,y:0.05}, Rc={x:0.95,y:-0.02};          // corners
  const up=(t)=>{const x=L.x+(Rc.x-L.x)*t; const y=(L.y+(Rc.y-L.y)*t)-0.62*Math.sin(Math.PI*Math.pow(t,0.9)); return {x,y}};
  const lo=(t)=>{const x=L.x+(Rc.x-L.x)*t; const y=(L.y+(Rc.y-L.y)*t)+0.42*Math.sin(Math.PI*Math.pow(t,1.15)); return {x,y}};
  const poly=(f,n,jit)=>{let d='';for(let i=0;i<=n;i++){const p=f(i/n);d+=(i?'L':'M')+(p.x+j(jit)).toFixed(3)+' '+(p.y+j(jit)).toFixed(3)}return d};
  let s='';
  // iris: filled disc + archimedean spiral + jittered rings, clipped to the almond
  const ic={x:-0.05+j(.03),y:-0.2}, ir=0.46;
  let clip=poly(up,40,0)+' '+poly(t=>lo(1-t),40,0).replace('M','L')+'Z';
  let sp='';const turns=7,steps=turns*48;
  for(let i=0;i<=steps;i++){const th=i/48*2*Math.PI, r=0.015+ir*0.92*i/steps + 0.012*Math.sin(th*0.37+seed) + j(0.002);
    sp+=(i?'L':'M')+(ic.x+r*Math.cos(th)).toFixed(3)+' '+(ic.y+r*Math.sin(th)).toFixed(3)}
  let rings='';for(let k=0;k<3;k++){const rr=ir*(0.55+k*0.2)+j(.01);rings+=`<circle cx="${ic.x}" cy="${ic.y}" r="${rr.toFixed(3)}" fill="none" stroke="#f0f0f0" stroke-opacity=".35" stroke-width=".008" stroke-dasharray="${(0.2+R()*.3).toFixed(2)} ${(0.03+R()*.06).toFixed(2)}"/>`}
  s+=`<clipPath id="${id}c"><path d="${clip}"/></clipPath><g clip-path="url(#${id}c)">
      <circle class="iris" cx="${ic.x}" cy="${ic.y}" r="${ir}" fill="#7a7a7a" fill-opacity=".45"/>
      <path class="spiral" d="${sp}" fill="none" stroke="#f0f0f0" stroke-opacity=".55" stroke-width=".011"/>${rings}
      <circle cx="${ic.x}" cy="${ic.y}" r="${ir}" fill="none" stroke="#f0f0f0" stroke-width=".02" stroke-opacity=".8"/></g>`;
  // lids: 3 sketchy passes each
  for(let k=0;k<3;k++){s+=`<path d="${poly(up,28,.018)}" fill="none" stroke="#f0f0f0" stroke-width="${(.012+R()*.012).toFixed(3)}" stroke-linecap="round" opacity="${(.6+R()*.4).toFixed(2)}"/>`;
                       s+=`<path d="${poly(lo,24,.02)}" fill="none" stroke="#f0f0f0" stroke-width="${(.008+R()*.01).toFixed(3)}" stroke-linecap="round" opacity="${(.5+R()*.4).toFixed(2)}"/>`}
  // second lower line (the "bag" line) + hatching
  const lo2=t=>{const p=lo(t);return{x:p.x+0.04,y:p.y+0.09*Math.sin(Math.PI*t)}};
  s+=`<path d="${poly(lo2,24,.02)}" fill="none" stroke="#f0f0f0" stroke-width=".008" opacity=".55"/>`;
  for(let i=0;i<14;i++){const t=0.35+i/14*0.6,a=lo(t),b=lo2(t);s+=`<path d="M${a.x+j(.01)} ${a.y} L${b.x+j(.02)} ${b.y+j(.01)}" stroke="#f0f0f0" stroke-width=".007" opacity=".5"/>`}
  // lashes: tapered spikes along the upper lid, longer toward the outer corner, leaning outward
  const lash=(t,len,lean,w)=>{const p=up(t),q=up(Math.min(1,t+.01));let nx=(q.y-p.y),ny=-(q.x-p.x);const m=Math.hypot(nx,ny);nx/=m;ny/=m;
      const c=Math.cos(lean),sn=Math.sin(lean),dx=nx*c-ny*sn,dy=nx*sn+ny*c;const tip={x:p.x+dx*len,y:p.y+dy*len};
      const bx=-dy*w,by=dx*w;return `<path d="M${(p.x-bx).toFixed(3)} ${(p.y-by).toFixed(3)} Q${(p.x+dx*len*.5+j(.02)).toFixed(3)} ${(p.y+dy*len*.5).toFixed(3)} ${tip.x.toFixed(3)} ${tip.y.toFixed(3)} Q${(p.x+dx*len*.45).toFixed(3)} ${(p.y+dy*len*.45).toFixed(3)} ${(p.x+bx).toFixed(3)} ${(p.y+by).toFixed(3)}Z" fill="#f0f0f0" opacity="${(.7+R()*.3).toFixed(2)}"/>`};
  const nL=o.lashes||54;for(let i=0;i<nL;i++){const t=0.06+i/nL*0.92+j(.008);const long=R()<.18;const len=(long?.2:.05)+R()*(long?.18:.07)+t*.06;s+=lash(t,len,-0.35*t+j(.25),.012+R()*.008)}
  // lower lashes: short, sparse
  for(let i=0;i<22;i++){const t=0.2+i/22*0.78,p=lo2(t);s+=`<path d="M${p.x} ${p.y} l${j(.02)} ${(.04+R()*.06).toFixed(3)}" stroke="#f0f0f0" stroke-width=".008" opacity=".6"/>`}
  const glow=`<filter id="${id}g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation=".012" result="a"/><feGaussianBlur in="SourceGraphic" stdDeviation=".05" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  return `<svg width="${W}" height="${H}" viewBox="-1.15 -1.0 2.3 1.65" xmlns="http://www.w3.org/2000/svg"><defs>${glow}</defs><g filter="url(#${id}g)" transform="rotate(${(o.tilt??-6)})">${s}</g></svg>`;
}
document.body.innerHTML=[1,7,42].map(sd=>eyeSVG(sd,{size:540})).join('');
</script></body></html>
